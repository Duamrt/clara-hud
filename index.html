<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Clara — Painel</title>
<meta name="description" content="HUD da Clara — assistente pessoal do Duam.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff7a99">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Clara">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  :root {
    --accent: #ff7a99;
    --accent-2: #ff5577;
    --accent-soft: #ffcfd9;
    --accent-dim: #6b2a3c;
    --bg-deep: #02020a;
    --bg-mid: #0a0510;
    --text: #ffd5d5;
    --text-dim: rgba(255, 213, 213, 0.45);
    --text-faint: rgba(255, 213, 213, 0.22);
    --hairline: rgba(255, 122, 153, 0.18);
    --hairline-strong: rgba(255, 122, 153, 0.35);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    min-height: 100vh;
    background: var(--bg-deep);
    color: var(--text);
    font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
    font-weight: 400;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  body {
    background:
      radial-gradient(ellipse 80% 60% at 50% 50%, rgba(40, 8, 22, 0.55) 0%, transparent 70%),
      radial-gradient(ellipse 100% 100% at 50% 100%, rgba(20, 4, 14, 0.6) 0%, transparent 60%),
      var(--bg-deep);
    position: relative;
  }

  /* ===== HUD CORNERS ===== */
  .hud-corner {
    position: fixed;
    width: 28px;
    height: 28px;
    border: 1px solid var(--accent);
    opacity: 0.7;
    z-index: 50;
    pointer-events: none;
    box-shadow: 0 0 12px rgba(255, 122, 153, 0.25);
  }
  .hud-corner.tl { top: 18px; left: 18px; border-right: none; border-bottom: none; }
  .hud-corner.tr { top: 18px; right: 18px; border-left: none; border-bottom: none; }
  .hud-corner.bl { bottom: 18px; left: 18px; border-right: none; border-top: none; }
  .hud-corner.br { bottom: 18px; right: 18px; border-left: none; border-top: none; }

  @media (min-width: 768px) {
    .hud-corner { width: 36px; height: 36px; }
    .hud-corner.tl, .hud-corner.tr { top: 28px; }
    .hud-corner.bl, .hud-corner.br { bottom: 28px; }
    .hud-corner.tl, .hud-corner.bl { left: 28px; }
    .hud-corner.tr, .hud-corner.br { right: 28px; }
  }

  /* ===== CONSTELLATION BG ===== */
  #constellation {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
  }

  /* ===== STAGE ===== */
  .stage {
    position: relative;
    z-index: 10;
    min-height: 100vh;
    min-height: 100dvh;
    display: grid;
    /* header / title / core (cresce + centra) / bottom */
    grid-template-rows: auto auto 1fr auto;
    padding: 32px 22px 22px;
    gap: 0;
  }
  @media (min-width: 768px) {
    .stage { padding: 40px 56px 28px; }
  }

  /* ===== HEADER ===== */
  .header {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: start;
    gap: 16px;
  }

  .weather {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .weather__loc {
    font-size: 10px;
    letter-spacing: 0.22em;
    color: var(--text-dim);
    font-weight: 500;
    text-transform: uppercase;
  }
  .weather__row {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .weather__temp {
    font-size: 22px;
    font-weight: 300;
    color: var(--text);
    letter-spacing: 0.02em;
    line-height: 1;
  }
  .weather__cond {
    font-size: 9px;
    letter-spacing: 0.28em;
    color: var(--text-dim);
    text-transform: uppercase;
    font-weight: 500;
  }
  .weather__meta {
    display: flex;
    gap: 12px;
    font-size: 9px;
    letter-spacing: 0.2em;
    color: var(--text-faint);
    text-transform: uppercase;
    margin-top: 2px;
  }
  .weather__meta span::before {
    content: '';
    display: inline-block;
    width: 4px;
    height: 4px;
    background: var(--accent);
    border-radius: 50%;
    margin-right: 6px;
    vertical-align: middle;
    transform: translateY(-1px);
    opacity: 0.6;
  }

  @media (min-width: 768px) {
    .weather__temp { font-size: 28px; }
    .weather__loc { font-size: 11px; }
    .weather__cond, .weather__meta { font-size: 10px; }
  }

  .clock {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
  }
  .clock__time {
    font-size: 44px;
    font-weight: 300;
    color: var(--accent);
    letter-spacing: 0.04em;
    line-height: 1;
    text-shadow:
      0 0 18px rgba(255, 122, 153, 0.45),
      0 0 38px rgba(255, 122, 153, 0.2);
    font-variant-numeric: tabular-nums;
    display: flex;
    align-items: baseline;
    gap: 1px;
  }
  .clock__sep {
    animation: blink 1.6s infinite ease-in-out;
    opacity: 0.85;
  }
  @keyframes blink {
    0%, 50% { opacity: 0.85; }
    51%, 100% { opacity: 0.3; }
  }
  .clock__sec {
    font-size: 14px;
    color: var(--accent-soft);
    opacity: 0.55;
    margin-left: 6px;
    letter-spacing: 0.04em;
    align-self: baseline;
    font-variant-numeric: tabular-nums;
  }
  .clock__date {
    font-size: 10px;
    letter-spacing: 0.28em;
    color: var(--text-dim);
    text-transform: uppercase;
    font-weight: 500;
    border-top: 1px solid var(--hairline);
    padding-top: 6px;
    margin-top: 4px;
    width: 100%;
    text-align: right;
  }

  @media (min-width: 768px) {
    .clock__time { font-size: 58px; }
    .clock__sec { font-size: 16px; }
    .clock__date { font-size: 11px; padding-top: 8px; }
  }

  @media (min-width: 1280px) {
    .clock__time { font-size: 68px; }
    .clock__sec { font-size: 18px; }
  }

  @media (min-width: 1280px) and (min-height: 820px) {
    .clock__time { font-size: 76px; }
    .clock__sec { font-size: 20px; }
  }

  /* ===== TITLE BAND ===== */
  .title-band {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 22px auto 0;
    padding: 0 4px;
    max-width: 720px;
    width: 100%;
  }
  .title-band__line {
    flex: 1;
    height: 1px;
    background: linear-gradient(to right, transparent, var(--hairline-strong));
  }
  .title-band__line.right {
    background: linear-gradient(to left, transparent, var(--hairline-strong));
  }
  .title-band__label {
    font-size: 10px;
    letter-spacing: 0.5em;
    color: var(--text);
    text-transform: uppercase;
    font-weight: 500;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 18px;
  }
  .title-band__label .title-word {
    font-size: 28px;
    font-weight: 300;
    letter-spacing: 0.7em;
    padding-left: 0.7em; /* optical centering against trailing letter-spacing */
    color: var(--text);
    text-shadow:
      0 0 12px rgba(255, 122, 153, 0.55),
      0 0 28px rgba(255, 122, 153, 0.3),
      0 0 60px rgba(255, 122, 153, 0.18);
  }
  @media (min-width: 768px) {
    .title-band__label .title-word {
      font-size: 38px;
      letter-spacing: 0.85em;
      padding-left: 0.85em;
    }
  }
  @media (min-width: 1280px) {
    .title-band__label .title-word {
      font-size: 46px;
      letter-spacing: 1em;
      padding-left: 1em;
    }
  }
  .title-band__label .dot {
    width: 5px;
    height: 5px;
    background: var(--accent);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--accent);
    flex-shrink: 0;
  }
  .title-band__label .sep {
    color: var(--accent);
    opacity: 0.7;
    font-weight: 300;
  }
  .title-band__label .sub {
    color: var(--text-dim);
    font-weight: 400;
  }

  @media (min-width: 768px) {
    .title-band { margin-top: 28px; gap: 24px; }
    .title-band__label { font-size: 11px; letter-spacing: 0.6em; gap: 22px; }
  }

  /* ===== CORE AREA ===== */
  .core-area {
    position: relative;
    display: grid;
    place-items: center;
    min-height: 320px;
    padding: 18px 0;
  }
  @media (min-width: 768px) {
    .core-area { padding: 12px 0; min-height: 0; }
  }

  .core-svg-wrap {
    position: relative;
    width: min(78vw, 440px);
    aspect-ratio: 1;
  }
  @media (min-width: 768px) {
    .core-svg-wrap { width: min(40vw, 420px); }
  }
  @media (min-width: 768px) and (min-height: 820px) {
    .core-svg-wrap { width: min(44vw, 480px); }
  }

  .core-svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  /* Orbit rotation animations */
  .ring-tick { animation: spin-slow 60s linear infinite; transform-origin: 250px 250px; }
  .ring-arc-outer { animation: spin-rev 28s linear infinite; transform-origin: 250px 250px; }
  .ring-arc-inner { animation: spin-fwd 18s linear infinite; transform-origin: 250px 250px; }
  .inner-poly { animation: spin-rev 42s linear infinite; transform-origin: 250px 250px; }
  .vertex-dots { animation: spin-fwd 42s linear infinite; transform-origin: 250px 250px; }

  @keyframes spin-slow { to { transform: rotate(360deg); } }
  @keyframes spin-fwd { to { transform: rotate(360deg); } }
  @keyframes spin-rev { to { transform: rotate(-360deg); } }

  .core-glow {
    animation: pulse-glow 2.6s ease-in-out infinite;
    transform-origin: 250px 250px;
  }
  @keyframes pulse-glow {
    0%, 100% { opacity: 0.9; transform: scale(1); }
    50%      { opacity: 1; transform: scale(1.08); }
  }

  .core-halo {
    animation: pulse-halo 3.4s ease-in-out infinite;
    transform-origin: 250px 250px;
  }
  @keyframes pulse-halo {
    0%, 100% { opacity: 0.35; transform: scale(0.95); }
    50%      { opacity: 0.65; transform: scale(1.15); }
  }

  /* Side readouts flanking the core (desktop only) */
  .core-readouts {
    display: none;
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  @media (min-width: 1100px) {
    .core-readouts { display: block; }
  }
  .readout {
    position: absolute;
    font-size: 9px;
    letter-spacing: 0.25em;
    color: var(--text-dim);
    text-transform: uppercase;
    display: flex;
    flex-direction: column;
    gap: 4px;
    line-height: 1.4;
  }
  .readout .k { color: var(--accent); opacity: 0.7; }
  .readout .v { color: var(--text); font-weight: 500; }
  .readout.tl { top: 6%;  left: -2%;  text-align: left; }
  .readout.tr { top: 6%;  right: -2%; text-align: right; align-items: flex-end; }
  .readout.bl { bottom: 6%; left: -2%; text-align: left; }
  .readout.br { bottom: 6%; right: -2%; text-align: right; align-items: flex-end; }

  /* ===== STATUS PILL ===== */
  .status-wrap {
    display: grid;
    place-items: center;
    margin-top: 4px;
    margin-bottom: 18px;
  }
  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 10px 18px 10px 14px;
    border: 1px solid var(--hairline-strong);
    border-radius: 999px;
    background:
      linear-gradient(180deg, rgba(255,122,153,0.05) 0%, rgba(255,122,153,0.02) 100%),
      rgba(10, 5, 16, 0.6);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    font-size: 10px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--text);
    font-weight: 500;
    box-shadow:
      0 0 0 1px rgba(255,122,153,0.04) inset,
      0 8px 30px rgba(255, 122, 153, 0.08);
    cursor: default;
    transition: all 0.3s ease;
  }
  .status-pill:hover {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px rgba(255,122,153,0.06) inset, 0 8px 36px rgba(255,122,153,0.18);
  }

  .status-pill__dot {
    position: relative;
    width: 8px;
    height: 8px;
    flex-shrink: 0;
  }
  .status-pill__dot::before,
  .status-pill__dot::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: var(--accent);
  }
  .status-pill__dot::before {
    box-shadow: 0 0 10px var(--accent), 0 0 20px var(--accent);
    animation: dot-pulse 1.6s ease-in-out infinite;
  }
  .status-pill__dot::after {
    animation: dot-ring 2s ease-out infinite;
    opacity: 0;
  }
  @keyframes dot-pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50%      { transform: scale(0.7); opacity: 0.7; }
  }
  @keyframes dot-ring {
    0%   { transform: scale(1); opacity: 0.6; }
    100% { transform: scale(3.2); opacity: 0; }
  }

  .status-pill__sep {
    width: 1px;
    height: 12px;
    background: var(--hairline-strong);
  }
  .status-pill__cmd {
    color: var(--accent-soft);
    opacity: 0.85;
  }
  .status-pill__cmd .q { color: var(--accent); margin: 0 2px; }

  @media (min-width: 768px) {
    .status-pill { font-size: 11px; padding: 12px 22px 12px 18px; gap: 14px; }
    .status-pill__dot { width: 9px; height: 9px; }
    .status-wrap { margin-top: 8px; margin-bottom: 22px; }
  }

  /* ===== SHORTCUTS ===== */
  .shortcuts {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    max-width: 520px;
    margin: 0 auto;
    width: 100%;
    opacity: 0.12;
    transition: opacity 0.45s cubic-bezier(0.4, 0, 0.2, 1);
    pointer-events: none;
  }
  @media (min-width: 720px) {
    .shortcuts {
      grid-template-columns: repeat(6, 1fr);
      max-width: 980px;
      gap: 14px;
    }
  }
  /* Desktop: revela no hover na seção inferior */
  @media (hover: hover) {
    main > section:last-of-type:hover .shortcuts,
    .shortcuts:hover,
    .shortcuts:focus-within {
      opacity: 1;
      pointer-events: auto;
    }
  }
  /* Touch (sem hover): mostra discreto, sempre acessível */
  @media (hover: none) {
    .shortcuts {
      opacity: 0.55;
      pointer-events: auto;
    }
    .shortcuts:focus-within { opacity: 1; }
  }

  .sc {
    position: relative;
    background:
      linear-gradient(180deg, rgba(255,122,153,0.035) 0%, rgba(255,122,153,0.008) 100%),
      rgba(8, 4, 14, 0.4);
    border: 1px solid var(--hairline);
    border-radius: 8px;
    padding: 8px 10px;
    cursor: pointer;
    transition: all 0.25s ease;
    overflow: hidden;
    text-align: left;
    color: inherit;
    font-family: inherit;
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 44px;
    opacity: 0.78;
  }
  .sc:hover { opacity: 1; }
  .sc::before, .sc::after { display: none; }
  .sc:hover {
    border-color: var(--hairline-strong);
    background:
      linear-gradient(180deg, rgba(255,122,153,0.07) 0%, rgba(255,122,153,0.02) 100%),
      rgba(14, 6, 20, 0.6);
    transform: translateY(-1px);
    box-shadow: 0 4px 14px rgba(0,0,0,0.4), 0 0 14px rgba(255,122,153,0.06);
  }

  .sc:focus-visible {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(255,122,153,0.25);
  }

  .sc.is-active {
    border-color: var(--accent);
    background:
      linear-gradient(180deg, rgba(255,122,153,0.14) 0%, rgba(255,122,153,0.04) 100%),
      rgba(20, 8, 26, 0.8);
  }

  .sc__head { display: contents; }
  .sc__icon {
    width: 14px;
    height: 14px;
    color: var(--accent);
    opacity: 0.7;
    flex-shrink: 0;
  }
  .sc__id { display: none; }
  .sc__bar { display: none; }
  .sc__body {
    display: flex;
    flex-direction: column;
    gap: 1px;
    min-width: 0;
    flex: 1;
  }
  .sc__code {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.14em;
    color: var(--text);
    line-height: 1;
  }
  .sc__label {
    font-size: 7px;
    letter-spacing: 0.18em;
    color: var(--text-faint);
    text-transform: uppercase;
    font-weight: 500;
    line-height: 1.2;
  }
  @media (min-width: 720px) {
    .sc { padding: 9px 12px; min-height: 48px; }
    .sc__icon { width: 15px; height: 15px; }
    .sc__code { font-size: 13px; }
    .sc__label { font-size: 7.5px; }
  }

  /* ===== SYSTEM BAR (top-center thin row) ===== */
  .sysbar {
    display: flex;
    justify-content: center;
    gap: 18px;
    margin-top: 10px;
    font-size: 8px;
    letter-spacing: 0.3em;
    color: var(--text-faint);
    text-transform: uppercase;
    font-weight: 500;
  }
  .sysbar span {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .sysbar i {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 6px var(--accent);
    opacity: 0.85;
    display: inline-block;
  }
  .sysbar i.amber { background: #ffb070; box-shadow: 0 0 6px #ffb070; }
  @media (min-width: 768px) {
    .sysbar { font-size: 9px; gap: 26px; }
  }

  /* ===== Footer caption ===== */
  .footer-cap {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-top: 12px;
    padding: 0 4px;
    font-size: 8.5px;
    letter-spacing: 0.3em;
    color: var(--text-faint);
    text-transform: uppercase;
    font-weight: 500;
  }
  .footer-cap .v { color: var(--accent); opacity: 0.75; }
  @media (min-width: 768px) {
    .footer-cap { font-size: 9.5px; margin-top: 14px; }
  }

  /* Scanline overlay (very subtle) */
  .scan {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 5;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 3px,
      rgba(255, 122, 153, 0.012) 3px,
      rgba(255, 122, 153, 0.012) 4px
    );
    mix-blend-mode: screen;
  }

  /* ===== CORE CLICÁVEL (abre chat overlay) ===== */
  .core-svg-wrap {
    cursor: pointer;
    transition: transform 0.25s ease, filter 0.25s ease;
  }
  .core-svg-wrap:hover { transform: scale(1.02); filter: brightness(1.1); }
  .core-svg-wrap:active { transform: scale(0.99); }

  /* ===== CHAT OVERLAY ===== */
  .chat-panel {
    position: fixed;
    top: 0; right: 0;
    width: min(420px, 100vw);
    height: 100vh; height: 100dvh;
    background: rgba(12, 4, 12, 0.92);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    border-left: 1px solid var(--hairline-strong);
    box-shadow: -10px 0 60px rgba(0,0,0,0.6), -20px 0 80px rgba(255,122,153,0.06);
    transform: translateX(100%);
    transition: transform 0.32s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 100;
    display: flex; flex-direction: column;
  }
  .chat-panel.open { transform: translateX(0); }
  @media (max-width: 700px) { .chat-panel { width: 100vw; } }

  .chat-header {
    padding: 22px 24px 16px;
    border-bottom: 1px solid var(--hairline);
    display: flex; align-items: center; justify-content: space-between;
  }
  .chat-header .title-block .name {
    font-size: 0.9rem; letter-spacing: 0.4em; color: var(--accent);
    text-shadow: 0 0 12px rgba(255,122,153,0.5); text-transform: uppercase;
  }
  .chat-header .title-block .sub {
    font-size: 0.55rem; letter-spacing: 0.35em; opacity: 0.45;
    text-transform: uppercase; margin-top: 4px;
  }
  .chat-close {
    width: 32px; height: 32px;
    background: transparent; border: 1px solid var(--hairline);
    border-radius: 6px; color: var(--accent);
    font-size: 18px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .chat-close:hover { background: rgba(255,122,153,0.1); border-color: var(--accent); }

  .chat-messages {
    flex: 1; overflow-y: auto;
    padding: 20px 22px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .chat-messages::-webkit-scrollbar { width: 6px; }
  .chat-messages::-webkit-scrollbar-thumb { background: rgba(255,122,153,0.25); border-radius: 3px; }

  .msg {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 0.82rem; line-height: 1.45;
    word-wrap: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: linear-gradient(135deg, rgba(255,122,153,0.22), rgba(184,38,74,0.28));
    border: 1px solid rgba(255,122,153,0.3);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg.clara {
    align-self: flex-start;
    background: rgba(255,213,213,0.04);
    border: 1px solid var(--hairline);
    color: var(--accent-soft);
    border-bottom-left-radius: 4px;
  }
  .msg.system {
    align-self: center;
    background: transparent; border: none;
    font-size: 0.7rem; opacity: 0.4; letter-spacing: 0.15em;
    text-transform: uppercase;
  }
  .msg-audio-row {
    display: flex; align-items: center; gap: 8px;
    margin-top: 6px;
    font-size: 0.7rem; opacity: 0.85;
  }
  .msg-audio-row button {
    background: rgba(255,122,153,0.15);
    border: 1px solid var(--hairline);
    color: var(--accent);
    width: 26px; height: 26px;
    border-radius: 50%;
    font-size: 11px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .msg-audio-row button:hover { background: rgba(255,122,153,0.3); }

  /* Mic Visualizer (equalizer ao gravar) */
  .mic-visualizer {
    display: flex; align-items: center; justify-content: center;
    gap: 3px;
    height: 0; overflow: hidden;
    padding: 0 18px;
    border-top: 1px solid transparent;
    transition: height 0.28s cubic-bezier(0.4,0,0.2,1),
                padding 0.28s ease, border-color 0.28s ease;
  }
  .mic-visualizer.active {
    height: 38px; padding: 6px 18px;
    border-top: 1px solid var(--hairline);
  }
  .mic-bar {
    width: 3px; min-height: 3px;
    background: var(--accent);
    border-radius: 2px;
    box-shadow: 0 0 4px rgba(255,122,153,0.6);
    transform: scaleY(0.15);
    transform-origin: center;
    transition: transform 0.06s ease;
  }

  .chat-input-wrap {
    padding: 14px 18px 22px;
    border-top: 1px solid var(--hairline);
    display: flex; gap: 10px; align-items: center;
  }
  .chat-input {
    flex: 1;
    background: rgba(255,122,153,0.04);
    border: 1px solid var(--hairline);
    border-radius: 10px;
    padding: 12px 14px;
    color: var(--text);
    font-family: inherit;
    font-size: 0.85rem;
    outline: none;
    resize: none;
    min-height: 42px; max-height: 120px;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .chat-input:focus {
    border-color: var(--accent);
    background: rgba(255,122,153,0.08);
  }
  .chat-input::placeholder { color: var(--text-faint); }

  .chat-send, .chat-mic {
    width: 42px; height: 42px;
    border: none; border-radius: 10px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.12s ease, box-shadow 0.15s ease, background 0.15s ease;
    flex-shrink: 0;
  }
  .chat-send {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #1a0510;
    font-size: 16px; font-weight: 700;
    box-shadow: 0 0 18px rgba(255,122,153,0.45);
  }
  .chat-send:hover { transform: scale(1.06); box-shadow: 0 0 26px rgba(255,122,153,0.7); }
  .chat-send:active { transform: scale(0.96); }
  .chat-send:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .chat-mic {
    background: rgba(255,122,153,0.08);
    border: 1px solid var(--hairline);
    color: var(--accent);
    font-size: 18px;
  }
  .chat-mic:hover { background: rgba(255,122,153,0.18); border-color: var(--accent); }
  .chat-mic.recording {
    background: linear-gradient(135deg, #ff3060, #b8264a);
    border-color: #ff3060;
    color: #fff;
    box-shadow: 0 0 18px rgba(255,48,96,0.7);
    animation: mic-pulse 1.2s ease-in-out infinite;
  }
  @keyframes mic-pulse {
    0%,100% { box-shadow: 0 0 14px rgba(255,48,96,0.55); }
    50%     { box-shadow: 0 0 24px rgba(255,48,96,0.9); }
  }
  .chat-mic.processing { opacity: 0.5; pointer-events: none; }

  /* ===== MIC MINI VISUALIZER (pill principal) ===== */
  .mic-mini {
    display: flex;
    align-items: center;
    gap: 2px;
    height: 16px;
    margin: 0 2px;
  }
  .mic-mini__bar {
    width: 2px;
    background: var(--accent);
    border-radius: 1px;
    height: 3px;
    transform-origin: center;
    transition: height 0.08s ease;
    opacity: 0.7;
  }
  .mic-mini.blocked .mic-mini__bar {
    background: #ffb070;
    height: 3px !important;
    opacity: 0.5;
  }
  /* ponto âmbar quando mic bloqueado */
  #pillDot.blocked::before,
  #pillDot.blocked::after {
    background: #ffb070;
    box-shadow: 0 0 10px #ffb070, 0 0 20px #ffb070;
  }
</style>
</head>

<script>
  /* ============ VERSÃO ============ */
  const VERSION = "v2.5";
  document.getElementById("hud-version").textContent = VERSION;
  console.log("[Clara HUD]", VERSION, new Date().toISOString());

  /* ============ CLOCK ============ */
  const tH = document.getElementById('t-h');
  const tM = document.getElementById('t-m');
  const tS = document.getElementById('t-s');
  const tDate = document.getElementById('t-date');
  const tFoot = document.getElementById('ts-foot');

  const DAYS = ['DOM','SEG','TER','QUA','QUI','SEX','SAB'];
  const MONTHS = ['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];

  function pad(n) { return String(n).padStart(2, '0'); }
  function weekOfYear(d) {
    const start = new Date(d.getFullYear(), 0, 1);
    const diff = (d - start) / 86400000;
    return Math.ceil((diff + start.getDay() + 1) / 7);
  }

  const startTs = Date.now();
  function tick() {
    const d = new Date();
    tH.textContent = pad(d.getHours());
    tM.textContent = pad(d.getMinutes());
    tS.textContent = pad(d.getSeconds());
    tDate.textContent = `${DAYS[d.getDay()]} · ${pad(d.getDate())} ${MONTHS[d.getMonth()]} ${d.getFullYear()} · SEM ${pad(weekOfYear(d))}`;

    const elapsed = Math.floor((Date.now() - startTs) / 1000) + 152229; // arbitrary offset
    const hh = pad(Math.floor(elapsed / 3600));
    const mm = pad(Math.floor((elapsed % 3600) / 60));
    const ss = pad(elapsed % 60);
    if (tFoot) tFoot.textContent = `T+${hh}:${mm}:${ss}`;
  }
  tick();
  setInterval(tick, 1000);

  /* ============ CONSTELLATION BG ============ */
  (function buildConstellation() {
    const svg = document.getElementById('constellation');
    const W = window.innerWidth;
    const H = window.innerHeight;
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    svg.setAttribute('width', W);
    svg.setAttribute('height', H);

    // Clear and rebuild
    while (svg.firstChild) svg.removeChild(svg.firstChild);

    // Seeded random
    let seed = 4242;
    const rand = () => {
      seed = (seed * 9301 + 49297) % 233280;
      return seed / 233280;
    };

    const N = Math.min(140, Math.floor((W * H) / 9500));
    const points = [];
    for (let i = 0; i < N; i++) {
      points.push({
        x: rand() * W,
        y: rand() * H,
        r: 0.6 + rand() * 1.6,
        op: 0.18 + rand() * 0.6,
        delay: rand() * 4,
        dur: 2 + rand() * 4
      });
    }

    // Draw a few faint connecting lines (constellation feel)
    for (let i = 0; i < points.length; i++) {
      const a = points[i];
      // connect to nearest 1 point if close enough
      let best = null, bestD = Infinity;
      for (let j = i + 1; j < Math.min(points.length, i + 14); j++) {
        const b = points[j];
        const d = (a.x - b.x) ** 2 + (a.y - b.y) ** 2;
        if (d < bestD) { bestD = d; best = b; }
      }
      if (best && bestD < 26000 && rand() > 0.55) {
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', a.x); line.setAttribute('y1', a.y);
        line.setAttribute('x2', best.x); line.setAttribute('y2', best.y);
        line.setAttribute('stroke', '#ff7a99');
        line.setAttribute('stroke-width', '0.5');
        line.setAttribute('stroke-opacity', (0.04 + rand() * 0.06).toFixed(3));
        svg.appendChild(line);
      }
    }

    // Draw points with pulse
    points.forEach((p, i) => {
      const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      c.setAttribute('cx', p.x);
      c.setAttribute('cy', p.y);
      c.setAttribute('r', p.r);
      c.setAttribute('fill', i % 7 === 0 ? '#ffd5d5' : '#ff7a99');
      c.setAttribute('opacity', p.op);
      // pulse animation via SMIL fallback to keep deterministic
      const a = document.createElementNS('http://www.w3.org/2000/svg', 'animate');
      a.setAttribute('attributeName', 'opacity');
      a.setAttribute('values', `${p.op};${p.op * 0.25};${p.op}`);
      a.setAttribute('dur', `${p.dur}s`);
      a.setAttribute('begin', `${p.delay}s`);
      a.setAttribute('repeatCount', 'indefinite');
      c.appendChild(a);
      svg.appendChild(c);
    });
  })();

  // Rebuild on resize (debounced)
  let rTo;
  window.addEventListener('resize', () => {
    clearTimeout(rTo);
    rTo = setTimeout(() => {
      const e = new Event('rebuild');
      // simplest: reload constellation by re-running
      const svg = document.getElementById('constellation');
      while (svg.firstChild) svg.removeChild(svg.firstChild);
      // re-trigger by re-evaluating IIFE logic via location.hash trick — just rebuild inline:
      const W = window.innerWidth, H = window.innerHeight;
      svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
      svg.setAttribute('width', W); svg.setAttribute('height', H);
      let seed = 4242;
      const rand = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
      const N = Math.min(140, Math.floor((W * H) / 9500));
      for (let i = 0; i < N; i++) {
        const x = rand()*W, y = rand()*H, r = 0.6 + rand()*1.6, op = 0.18 + rand()*0.6;
        const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        c.setAttribute('cx', x); c.setAttribute('cy', y); c.setAttribute('r', r);
        c.setAttribute('fill', i % 7 === 0 ? '#ffd5d5' : '#ff7a99');
        c.setAttribute('opacity', op);
        const a = document.createElementNS('http://www.w3.org/2000/svg', 'animate');
        a.setAttribute('attributeName', 'opacity');
        a.setAttribute('values', `${op};${op*0.25};${op}`);
        a.setAttribute('dur', `${2+rand()*4}s`);
        a.setAttribute('begin', `${rand()*4}s`);
        a.setAttribute('repeatCount', 'indefinite');
        c.appendChild(a);
        svg.appendChild(c);
      }
    }, 250);
  });

  /* ============ TICK RING (around core) ============ */
  (function buildTickRing() {
    const g = document.getElementById('tickRing');
    const cx = 250, cy = 250, r = 175;
    // Labels giratórios removidos por decisão UX (poluição visual).
    const labels = [];

    // Tick marks
    const N = 96;
    for (let i = 0; i < N; i++) {
      const ang = (i / N) * Math.PI * 2 - Math.PI / 2;
      const isMajor = i % 8 === 0;
      const isMid = i % 4 === 0;
      const inner = r - (isMajor ? 8 : isMid ? 5 : 3);
      const outer = r;
      const x1 = cx + Math.cos(ang) * inner;
      const y1 = cy + Math.sin(ang) * inner;
      const x2 = cx + Math.cos(ang) * outer;
      const y2 = cy + Math.sin(ang) * outer;
      const ln = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      ln.setAttribute('x1', x1); ln.setAttribute('y1', y1);
      ln.setAttribute('x2', x2); ln.setAttribute('y2', y2);
      ln.setAttribute('stroke', '#ff7a99');
      ln.setAttribute('stroke-width', isMajor ? 1.2 : 0.7);
      ln.setAttribute('stroke-opacity', isMajor ? 0.7 : isMid ? 0.4 : 0.22);
      g.appendChild(ln);
    }

    // Curved labels
    const ns = 'http://www.w3.org/2000/svg';
    labels.forEach((lb, idx) => {
      const pathId = `tickPath${idx}`;
      const lr = r + 6;
      const startA = (lb.angle - 12) * Math.PI / 180;
      const endA   = (lb.angle + 12) * Math.PI / 180;
      const sx = cx + Math.cos(startA) * lr;
      const sy = cy + Math.sin(startA) * lr;
      const ex = cx + Math.cos(endA) * lr;
      const ey = cy + Math.sin(endA) * lr;
      const path = document.createElementNS(ns, 'path');
      path.setAttribute('id', pathId);
      path.setAttribute('d', `M ${sx} ${sy} A ${lr} ${lr} 0 0 1 ${ex} ${ey}`);
      path.setAttribute('fill', 'none');
      path.setAttribute('stroke', 'none');
      g.appendChild(path);

      const txt = document.createElementNS(ns, 'text');
      txt.setAttribute('font-family', 'JetBrains Mono, monospace');
      txt.setAttribute('font-size', '8');
      txt.setAttribute('letter-spacing', '2');
      txt.setAttribute('fill', '#ff7a99');
      txt.setAttribute('fill-opacity', '0.65');
      const tp = document.createElementNS(ns, 'textPath');
      tp.setAttribute('href', `#${pathId}`);
      tp.setAttribute('startOffset', '0');
      tp.textContent = lb.text;
      txt.appendChild(tp);
      g.appendChild(txt);
    });
  })();

  /* ============ INNER POLYGON ============ */
  (function buildPoly() {
    const poly = document.getElementById('innerPoly');
    const dots = document.getElementById('vertexDots');
    const cx = 250, cy = 250, r = 70;
    const N = 12;
    const verts = [];
    for (let i = 0; i < N; i++) {
      const ang = (i / N) * Math.PI * 2 - Math.PI / 2;
      verts.push({ x: cx + Math.cos(ang) * r, y: cy + Math.sin(ang) * r });
    }
    // Polygon outline
    const pts = verts.map(v => `${v.x},${v.y}`).join(' ');
    const pg = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
    pg.setAttribute('points', pts);
    pg.setAttribute('fill', 'none');
    pg.setAttribute('stroke', '#ff7a99');
    pg.setAttribute('stroke-opacity', '0.45');
    pg.setAttribute('stroke-width', '0.8');
    poly.appendChild(pg);

    // Cross lines (every other vertex to opposite)
    for (let i = 0; i < N; i++) {
      for (let j = i + 2; j < N; j++) {
        if ((j - i) % 2 !== 0) continue;
        const ln = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        ln.setAttribute('x1', verts[i].x); ln.setAttribute('y1', verts[i].y);
        ln.setAttribute('x2', verts[j].x); ln.setAttribute('y2', verts[j].y);
        ln.setAttribute('stroke', '#ff7a99');
        ln.setAttribute('stroke-opacity', '0.12');
        ln.setAttribute('stroke-width', '0.6');
        poly.appendChild(ln);
      }
    }

    // Vertex dots (rotating opposite direction)
    verts.forEach((v, i) => {
      const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      c.setAttribute('cx', v.x);
      c.setAttribute('cy', v.y);
      c.setAttribute('r', i % 3 === 0 ? 2.8 : 1.6);
      c.setAttribute('fill', i % 3 === 0 ? '#ffe6ec' : '#ff7a99');
      c.setAttribute('opacity', i % 3 === 0 ? 1 : 0.7);
      dots.appendChild(c);
    });
  })();

  /* ============ SHORTCUTS ============ */
  const SHORTCUTS = [
    { code: 'RPM', id: '01', label: 'RPM\u00a0PRO',     icon: 'tach' },
    { code: 'DMT', id: '02', label: 'DM\u00a0TECH',     icon: 'cog'  },
    { code: 'EDR', id: '03', label: 'EDR\u00a0SYS',     icon: 'shield' },

    { code: 'DMS', id: '05', label: 'DM\u00a0SMART',    icon: 'spark' },
    { code: 'OBS', id: '06', label: 'OBSIDIAN',         icon: 'gem' }
  ];

  const ICONS = {
    tach:   '<circle cx="9" cy="9" r="7" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M9 9 L13 5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="9" cy="9" r="1.2" fill="currentColor"/>',
    cog:    '<circle cx="9" cy="9" r="2.5" fill="none" stroke="currentColor" stroke-width="1.2"/><g stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><line x1="9" y1="1.5" x2="9" y2="3.5"/><line x1="9" y1="14.5" x2="9" y2="16.5"/><line x1="1.5" y1="9" x2="3.5" y2="9"/><line x1="14.5" y1="9" x2="16.5" y2="9"/><line x1="3.6" y1="3.6" x2="5" y2="5"/><line x1="13" y1="13" x2="14.4" y2="14.4"/><line x1="14.4" y1="3.6" x2="13" y2="5"/><line x1="5" y1="13" x2="3.6" y2="14.4"/></g>',
    shield: '<path d="M9 1.5 L15 4 V9 C15 12.5 12.5 15.2 9 16.5 C5.5 15.2 3 12.5 3 9 V4 Z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/><path d="M6.5 9 L8.2 10.7 L11.5 7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>',
    wallet: '<rect x="2" y="4.5" width="14" height="10" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M2 7 H16" stroke="currentColor" stroke-width="1.2"/><circle cx="12.5" cy="10.5" r="1.3" fill="currentColor"/>',
    spark:  '<path d="M9 1.5 L10.4 7.6 L16.5 9 L10.4 10.4 L9 16.5 L7.6 10.4 L1.5 9 L7.6 7.6 Z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>',
    gem:    '<path d="M3 6 L9 1.5 L15 6 L9 16.5 Z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/><path d="M3 6 L15 6 M9 1.5 L9 16.5 M6 6 L9 11 L12 6" stroke="currentColor" stroke-width="1" stroke-opacity="0.6" fill="none"/>'
  };

  const sc = document.getElementById('shortcuts');
  SHORTCUTS.forEach((s, idx) => {
    const btn = document.createElement('button');
    btn.className = 'sc';
    btn.type = 'button';
    btn.setAttribute('data-code', s.code);
    btn.innerHTML = `
      <svg class="sc__icon" viewBox="0 0 18 18" fill="none">${ICONS[s.icon]}</svg>
      <div class="sc__body">
        <div class="sc__code">${s.code}</div>
        <div class="sc__label">${s.label}</div>
      </div>
    `;
    btn.addEventListener('click', () => {
      document.querySelectorAll('.sc').forEach(x => x.classList.remove('is-active'));
      btn.classList.add('is-active');
    });
    sc.appendChild(btn);
  });

  /* ============ STATUS PILL pseudo-listening cycle ============ */
  const STATES = [
    'DIGA <span class="q">"</span>HEY CLARA<span class="q">"</span>',
    'AGUARDANDO COMANDO',
    'DIGA <span class="q">"</span>HEY CLARA<span class="q">"</span>',
  ];
  let stIdx = 0;
  setInterval(() => {
    stIdx = (stIdx + 1) % STATES.length;
    const pillCmd = document.getElementById('pillCmd');
    if (pillCmd) {
      pillCmd.style.opacity = '0.3';
      setTimeout(() => {
        pillCmd.innerHTML = STATES[stIdx];
        pillCmd.style.opacity = '0.85';
      }, 220);
    }
  }, 5200);

  /* ============ SUPABASE CONFIG ============ */
  const SUPABASE_URL = "https://bkfkzauhnlulrtttgcii.supabase.co";
  const SUPABASE_KEY = "sb_publishable_6tsPVQYcS9FlJM0ZwKKH-w_3xRRsm8h";
  const CHAT_SESSION_ID = "duam-clara-d7f3a2c1-9b4e-4f0a";

  /* ============ CHAT OVERLAY ============ */
  const claraStage = document.getElementById("claraStage");
  const chatPanel  = document.getElementById("chatPanel");
  const chatClose  = document.getElementById("chatClose");
  const chatForm   = document.getElementById("chatForm");
  const chatInput  = document.getElementById("chatInput");
  const chatMsgs   = document.getElementById("chatMessages");
  const chatMic    = document.getElementById("chatMic");
  const micViz     = document.getElementById("micVisualizer");

  let audioUnlocked = false;
  function unlockAudio() {
    if (audioUnlocked) return;
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const buf = ctx.createBuffer(1, 1, 22050);
      const src = ctx.createBufferSource();
      src.buffer = buf;
      src.connect(ctx.destination);
      src.start(0);
      ctx.resume().then(() => { audioUnlocked = true; ctx.close(); });
    } catch(_) {}
  }

  function openChat() {
    unlockAudio();
    chatPanel.classList.add("open");
    chatPanel.setAttribute("aria-hidden", "false");
    setTimeout(() => chatInput.focus(), 320);
  }
  function closeChat() {
    chatPanel.classList.remove("open");
    chatPanel.setAttribute("aria-hidden", "true");
  }
  function appendMsg(role, text, audioUrl, autoplay = true) {
    const div = document.createElement("div");
    div.className = `msg ${role}`;
    if (text) {
      const span = document.createElement("span");
      span.textContent = text;
      div.appendChild(span);
    }
    if (audioUrl) {
      const row = document.createElement("div");
      row.className = "msg-audio-row";
      const btn = document.createElement("button");
      btn.textContent = "▶";
      btn.title = "Tocar de novo";
      const audio = new Audio(audioUrl);
      audio.preload = "auto";
      btn.addEventListener("click", () => { audio.currentTime = 0; audio.play().catch(()=>{}); });
      row.appendChild(btn);
      const lab = document.createElement("span");
      lab.textContent = role === "user" ? "🎤 áudio enviado" : "🔊 voz da Clara";
      row.appendChild(lab);
      div.appendChild(row);
      if (role === "clara" && autoplay) audio.play().catch(err => console.log("[autoplay bloqueado]", err));
    }
    chatMsgs.appendChild(div);
    chatMsgs.scrollTop = chatMsgs.scrollHeight;
    return div;
  }

  claraStage.addEventListener("click", openChat);
  claraStage.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openChat(); }
  });
  chatClose.addEventListener("click", closeChat);
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && chatPanel.classList.contains("open")) closeChat();
  });

  chatInput.addEventListener("input", () => {
    chatInput.style.height = "auto";
    chatInput.style.height = Math.min(chatInput.scrollHeight, 120) + "px";
  });
  chatInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); chatForm.requestSubmit(); }
  });

  /* ============ SUPABASE REALTIME ============ */
  const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const seenIds = new Set();

  /* ============ MIC VISUALIZER — via Supabase broadcast do worker ============ */
  (function initMicViz() {
    const micMini = document.getElementById('micMini');
    const pillDot = document.getElementById('pillDot');
    const pillLbl = document.getElementById('pillLabel');
    const bars    = Array.from(micMini.querySelectorAll('.mic-mini__bar'));
    let animFrame = null;
    let rmsTarget = 0;
    const IDLE_H = 2, SPEAK_H = 6;

    function setFlat(h) {
      if (animFrame) { cancelAnimationFrame(animFrame); animFrame = null; }
      bars.forEach(b => { b.style.height = h + 'px'; });
    }
    function animateRms() {
      const N = bars.length;
      bars.forEach((b, i) => {
        const dist = Math.abs(i - (N-1)/2) / ((N-1)/2);
        const env  = Math.max(0, 1 - dist * 1.1);
        b.style.height = Math.min(Math.max(IDLE_H, rmsTarget * env * (0.85 + Math.random()*0.3)), 14).toFixed(1) + 'px';
      });
      animFrame = requestAnimationFrame(animateRms);
    }
    function applyState(state, rms) {
      if (state === 'listening') {
        rmsTarget = Math.max(4, Math.min(14, (rms || 0) / 18));
        pillLbl.textContent = 'OUVINDO';
        if (!animFrame) animateRms();
      } else if (state === 'processing') {
        setFlat(IDLE_H); pillLbl.textContent = 'PENSANDO';
      } else if (state === 'speaking') {
        setFlat(SPEAK_H); pillLbl.textContent = 'FALANDO';
      } else {
        setFlat(IDLE_H); pillLbl.textContent = 'OUVINDO';
      }
    }
    supa.channel('clara-status')
      .on('broadcast', { event: 'state' }, ({ payload }) => applyState(payload.state, payload.rms))
      .subscribe();
  })();

  function renderRow(row, autoplay = true) {
    if (seenIds.has(row.id)) return;
    seenIds.add(row.id);
    const audioUrl = row.metadata && row.metadata.audio_url ? row.metadata.audio_url : null;
    if (row.role === "system") appendMsg("system", row.text);
    else if (row.role === "user") appendMsg("user", row.text || "", audioUrl, false);
    else if (row.role === "clara") appendMsg("clara", row.text || "", audioUrl, autoplay);
  }

  async function loadHistory() {
    const { data, error } = await supa
      .from("clara_messages")
      .select("*")
      .eq("chat_session_id", CHAT_SESSION_ID)
      .order("created_at", { ascending: true })
      .limit(30);
    if (error) { console.warn("[Clara] erro carregar historico:", error); return; }
    chatMsgs.innerHTML = '<div class="msg system">Início da conversa</div>';
    (data || []).forEach(row => renderRow(row, false));
    if (!data || data.length === 0) appendMsg("clara", "Tô aqui, Chefe. Manda.");
  }
  loadHistory();

  supa.channel("clara-msgs")
    .on("postgres_changes",
        { event: "INSERT", schema: "public", table: "clara_messages",
          filter: `chat_session_id=eq.${CHAT_SESSION_ID}` },
        (payload) => renderRow(payload.new))
    .subscribe();

  chatForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const txt = chatInput.value.trim();
    if (!txt) return;
    chatInput.value = "";
    chatInput.style.height = "auto";
    chatInput.disabled = true;
    const { error } = await supa.from("clara_messages").insert({
      chat_session_id: CHAT_SESSION_ID,
      role: "user",
      source: "hud",
      text: txt,
    });
    chatInput.disabled = false;
    chatInput.focus();
    if (error) {
      console.warn("[Clara] erro enviar:", error);
      appendMsg("system", "Erro ao enviar — verifica conexão.");
    }
  });

  /* ============ MIC RECORDER + VISUALIZER ============ */
  let mediaRecorder = null;
  let recordedChunks = [];
  let recordingStartTs = 0;
  const NUM_BARS = 28;
  let audioCtx = null, analyser = null, vizFrame = null, vizSource = null;

  // Cria barras 1x
  (function initBars(){
    micViz.innerHTML = "";
    for (let i = 0; i < NUM_BARS; i++) {
      const bar = document.createElement("div");
      bar.className = "mic-bar";
      micViz.appendChild(bar);
    }
  })();
  const vizBars = micViz.children;

  function startVisualizer(stream) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      vizSource = audioCtx.createMediaStreamSource(stream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;
      analyser.smoothingTimeConstant = 0.7;
      vizSource.connect(analyser);
      micViz.classList.add("active");
      const data = new Uint8Array(analyser.frequencyBinCount);
      const sliceStep = Math.floor(data.length * 0.7 / NUM_BARS);
      function draw() {
        analyser.getByteFrequencyData(data);
        for (let i = 0; i < NUM_BARS; i++) {
          const center = (NUM_BARS - 1) / 2;
          const dist = Math.abs(i - center);
          const idx = Math.floor(dist * sliceStep) + 2;
          const v = (data[idx] || 0) / 255;
          const scale = 0.15 + v * 1.4;
          vizBars[i].style.transform = `scaleY(${Math.min(scale, 1.6).toFixed(3)})`;
        }
        vizFrame = requestAnimationFrame(draw);
      }
      draw();
    } catch (err) { console.warn("[viz] erro:", err); }
  }

  function stopVisualizer() {
    if (vizFrame) cancelAnimationFrame(vizFrame);
    vizFrame = null;
    if (vizSource) { try { vizSource.disconnect(); } catch(_){} vizSource = null; }
    analyser = null;
    micViz.classList.remove("active");
    for (let i = 0; i < vizBars.length; i++) {
      vizBars[i].style.transform = "scaleY(0.15)";
    }
  }

  function pickMimeType() {
    const candidates = ["audio/webm;codecs=opus","audio/webm","audio/ogg;codecs=opus","audio/mp4"];
    for (const m of candidates) {
      if (MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) return m;
    }
    return "";
  }

  async function startRecording() {
    if (mediaRecorder && mediaRecorder.state === "recording") return;
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (err) {
      appendMsg("system", "Sem permissão de microfone — habilita nas configurações.");
      return;
    }
    const mimeType = pickMimeType();
    try {
      mediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
    } catch (err) {
      appendMsg("system", "Navegador não suporta gravação de áudio.");
      stream.getTracks().forEach(t => t.stop());
      return;
    }
    recordedChunks = [];
    mediaRecorder.ondataavailable = (e) => {
      if (e.data && e.data.size > 0) recordedChunks.push(e.data);
    };
    mediaRecorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      stopVisualizer();
      const duration = (Date.now() - recordingStartTs) / 1000;
      if (duration < 0.5) {
        chatMic.classList.remove("recording", "processing");
        chatMic.textContent = "🎤";
        return;
      }
      const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || "audio/webm" });
      await uploadAndSendAudio(blob);
    };
    recordingStartTs = Date.now();
    mediaRecorder.start();
    chatMic.classList.add("recording");
    chatMic.textContent = "■";
    startVisualizer(stream);
  }

  function stopRecording() {
    if (mediaRecorder && mediaRecorder.state === "recording") {
      chatMic.classList.remove("recording");
      chatMic.classList.add("processing");
      chatMic.textContent = "⏳";
      mediaRecorder.stop();
    }
  }

  async function uploadAndSendAudio(blob) {
    try {
      const ext = blob.type.includes("ogg") ? "ogg" : blob.type.includes("mp4") ? "m4a" : "webm";
      const fileName = `${CHAT_SESSION_ID}/user-${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
      const { error: upErr } = await supa.storage.from("clara-audio").upload(fileName, blob, {
        contentType: blob.type, upsert: false,
      });
      if (upErr) {
        console.warn("[upload erro]", upErr);
        appendMsg("system", "Falha ao enviar áudio.");
        return;
      }
      const { data: pub } = supa.storage.from("clara-audio").getPublicUrl(fileName);
      const audioUrl = pub.publicUrl;
      const { error: insErr } = await supa.from("clara_messages").insert({
        chat_session_id: CHAT_SESSION_ID,
        role: "user", source: "hud",
        text: "[áudio]",
        metadata: { audio_url: audioUrl },
      });
      if (insErr) console.warn("[insert audio erro]", insErr);
    } catch (e) {
      console.warn("[uploadAndSendAudio]", e);
    } finally {
      chatMic.classList.remove("recording", "processing");
      chatMic.textContent = "🎤";
    }
  }

  chatMic.addEventListener("click", () => {
    if (mediaRecorder && mediaRecorder.state === "recording") stopRecording();
    else startRecording();
  });

  /* ============ SERVICE WORKER (PWA) ============ */
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", async () => {
      try {
        const KILL_VERSION_KEY = "clara-sw-kill-v4";
        if (!localStorage.getItem(KILL_VERSION_KEY)) {
          const regs = await navigator.serviceWorker.getRegistrations();
          for (const r of regs) await r.unregister();
          const cacheKeys = await caches.keys();
          for (const k of cacheKeys) await caches.delete(k);
          localStorage.setItem(KILL_VERSION_KEY, "1");
          console.log("[PWA] SW velho removido (v4)");
        }
        const reg = await navigator.serviceWorker.register("./service-worker.js");
        console.log("[PWA] SW registrado:", reg.scope);
        setInterval(() => reg.update().catch(() => {}), 5 * 60 * 1000);
      } catch (err) { console.warn("[PWA] SW falhou:", err); }
    });
  }
</script>
